[project]
name = "afterword"
version = "0.1.0"
description = "Assisted comment triage for technical publishing. A scoped experiment, not a product."
authors = [
    { name = "Ken W. Alger", email = "kenalger@comcast.net" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
afterword = "afterword.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
# Counts-only analysis aids, never a runtime dependency (afterword.language).
analysis = [
    "py3langid>=0.4.0",
]
dev = [
    "mypy>=2.4.0",
    "pydoclint>=0.11.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
# Parsed JSON payloads are `Any` at the boundary where they enter.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests need neither docstrings nor annotations (CLAUDE.md, Code standards).
"tests/**" = ["D", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts"]

[tool.pydoclint]
style = "sphinx"
exclude = "tests"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
skip-checking-private-functions = true
allow-init-docstring = true
check-class-attributes = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
